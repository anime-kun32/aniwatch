name: Build & Commit Dist

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Double check pnpm install
        run: pnpm --version

      # Backup install in case pnpm isn't found (uncommon but nice insurance)
      - name: Install pnpm (just in case)
        if: ${{ failure() }}
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build dist
        run: pnpm build

      - name: Commit & push dist
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dist
          git diff --cached --quiet || git commit -m "📦 Auto‑build dist"
          git push origin main